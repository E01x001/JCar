<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover + safe-area — 홈 화면에 추가해 전체화면으로 뜨면
      노치와 하단 제스처 바 영역까지 화면이 넓어진다. 이게 없으면 그 영역이
      흰 띠로 남는다. react-native-safe-area-context가 env()를 읽어 여백을 준다.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>J-Car</title>

    <!--
      PWA — 홈 화면에 추가했을 때 주소창 없이 앱처럼 뜬다.
      **일반 브라우저 방문에서는 주소창을 없앨 수 없다**(브라우저 보안 경계다.
      페이지가 브라우저 UI를 숨길 수 있으면 피싱이 가능해진다).
      대신 theme-color가 주소창 색을 앱 색으로 맞춰 이질감을 줄인다.
    -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#194399" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="J-Car" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <meta name="description" content="믿을 수 있는 중고차 거래 — 차량 인증 · 상담 예약 · 안전한 거래" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
