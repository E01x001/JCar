apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.firebase.crashlytics"

// Load keystore properties
def properties = new Properties()
def propertiesFile = rootProject.file("key.properties")
if (propertiesFile.exists()) {
    properties.load(propertiesFile.newDataInputStream())
} else {
    println("⚠️ Warning: key.properties not found. Release signing will fail.")
}



println "Root Directory: ${rootDir}"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    namespace "com.jcarnew"   // ✅ 통일된 namespace
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion "34.0.0"          // ✅ 실제 존재하는 최신 버전
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.jcarnew"   // ✅ google-services.json 과 일치
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.1"
    }

    signingConfigs {
        debug {
            storeFile file("C:/Users/jyjeo/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            storeFile file(properties['storeFile'])
            storePassword properties['storePassword']
            keyAlias properties['keyAlias']
            keyPassword properties['keyPassword']
        } 
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply plugin: "com.google.gms.google-services"   // ✅ 반드시 app/build.gradle 최하단!
apply plugin: 'com.google.firebase.crashlytics'
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
