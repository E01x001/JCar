<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    a { color: #2B4593; } a:hover { color: #1A2B5C; }
    * { box-sizing: border-box; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .cell { height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 12px; }
    .d { font-size: 14px; font-weight: 500; color: #212529; }
    .dots { display: flex; gap: 3px; height: 5px; align-items: center; }
    .dot { width: 5px; height: 5px; border-radius: 3px; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F8F9FA; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 20px 22px 0; display: flex; align-items: center; justify-content: space-between">
    <div style="font-size: 15px; font-weight: 600; color: #6C757D; letter-spacing: 0.02em">일정</div>

    <!-- 월 / 주 전환 — 두 축이 답하는 질문이 다르다 -->
    <div style="display: flex; background: #F1F3F5; border-radius: 999px; padding: 3px">
      <div style="padding: 6px 15px; border-radius: 999px; background: #FFFFFF; font-size: 12px; font-weight: 700; color: #212529; box-shadow: 0 1px 3px rgba(26,43,92,0.10)">월</div>
      <div style="padding: 6px 15px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #6C757D">주</div>
    </div>
  </div>

  <!-- 달 이동 -->
  <div style="padding: 18px 22px 14px; display: flex; align-items: center; justify-content: space-between">
    <div style="width: 32px; height: 32px; border-radius: 16px; border: 1px solid #E1E5EA; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6C757D" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6 9 12l5.5 6"/></svg>
    </div>
    <div class="num" style="font-size: 19px; font-weight: 700; color: #212529; letter-spacing: -0.01em">2026년 8월</div>
    <div style="width: 32px; height: 32px; border-radius: 16px; border: 1px solid #E1E5EA; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6C757D" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6 15 12l-5.5 6"/></svg>
    </div>
  </div>

  <!-- 달력 -->
  <div style="margin: 0 22px; background: #FFFFFF; border-radius: 18px; padding: 14px 12px 16px; box-shadow: 0 3px 18px rgba(26,43,92,0.08)">

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin-bottom: 4px">
      <div style="text-align: center; font-size: 11px; font-weight: 600; color: #DC3545; padding: 4px 0">일</div>
      <div style="text-align: center; font-size: 11px; font-weight: 600; color: #ADB5BD; padding: 4px 0">월</div>
      <div style="text-align: center; font-size: 11px; font-weight: 600; color: #ADB5BD; padding: 4px 0">화</div>
      <div style="text-align: center; font-size: 11px; font-weight: 600; color: #ADB5BD; padding: 4px 0">수</div>
      <div style="text-align: center; font-size: 11px; font-weight: 600; color: #ADB5BD; padding: 4px 0">목</div>
      <div style="text-align: center; font-size: 11px; font-weight: 600; color: #ADB5BD; padding: 4px 0">금</div>
      <div style="text-align: center; font-size: 11px; font-weight: 600; color: #2B4593; padding: 4px 0">토</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px">

      <div class="cell"><div class="d" style="color: #DEE2E6">26</div><div class="dots"></div></div>
      <div class="cell"><div class="d" style="color: #DEE2E6">27</div><div class="dots"></div></div>
      <div class="cell"><div class="d" style="color: #DEE2E6">28</div><div class="dots"></div></div>
      <div class="cell"><div class="d" style="color: #DEE2E6">29</div><div class="dots"></div></div>
      <div class="cell"><div class="d" style="color: #DEE2E6">30</div><div class="dots"></div></div>
      <div class="cell"><div class="d" style="color: #DEE2E6">31</div><div class="dots"></div></div>
      <div class="cell"><div class="d">1</div><div class="dots"></div></div>

      <div class="cell"><div class="d" style="color: #DC3545">2</div><div class="dots"></div></div>
      <div class="cell"><div class="d">3</div><div class="dots"><div class="dot" style="background: #2B4593"></div></div></div>
      <div class="cell"><div class="d">4</div><div class="dots"></div></div>
      <div class="cell"><div class="d">5</div><div class="dots"><div class="dot" style="background: #28A745"></div><div class="dot" style="background: #2B4593"></div></div></div>
      <div class="cell"><div class="d">6</div><div class="dots"></div></div>
      <div class="cell"><div class="d">7</div><div class="dots"><div class="dot" style="background: #2B4593"></div></div></div>
      <div class="cell"><div class="d">8</div><div class="dots"></div></div>

      <div class="cell"><div class="d" style="color: #DC3545">9</div><div class="dots"></div></div>
      <div class="cell"><div class="d">10</div><div class="dots"><div class="dot" style="background: #28A745"></div></div></div>
      <div class="cell"><div class="d">11</div><div class="dots"><div class="dot" style="background: #FFA000"></div><div class="dot" style="background: #28A745"></div><div class="dot" style="background: #2B4593"></div></div></div>
      <div class="cell"><div class="d">12</div><div class="dots"></div></div>
      <div class="cell"><div class="d">13</div><div class="dots"><div class="dot" style="background: #2B4593"></div></div></div>
      <div class="cell"><div class="d">14</div><div class="dots"></div></div>
      <div class="cell"><div class="d">15</div><div class="dots"></div></div>

      <div class="cell"><div class="d" style="color: #DC3545">16</div><div class="dots"></div></div>
      <div class="cell"><div class="d">17</div><div class="dots"><div class="dot" style="background: #28A745"></div></div></div>
      <div class="cell"><div class="d">18</div><div class="dots"></div></div>
      <div class="cell"><div class="d">19</div><div class="dots"><div class="dot" style="background: #2B4593"></div><div class="dot" style="background: #2B4593"></div></div></div>
      <div class="cell"><div class="d">20</div><div class="dots"></div></div>
      <div class="cell"><div class="d">21</div><div class="dots"><div class="dot" style="background: #DC3545"></div></div></div>
      <div class="cell"><div class="d">22</div><div class="dots"></div></div>

      <div class="cell"><div class="d" style="color: #DC3545">23</div><div class="dots"></div></div>
      <!-- 선택된 날 -->
      <div class="cell" style="background: #2B4593">
        <div class="d" style="color: #FFFFFF; font-weight: 700">24</div>
        <div class="dots"><div class="dot" style="background: #FFFFFF"></div></div>
      </div>
      <div class="cell"><div class="d">25</div><div class="dots"></div></div>
      <div class="cell"><div class="d">26</div><div class="dots"><div class="dot" style="background: #28A745"></div></div></div>
      <div class="cell"><div class="d">27</div><div class="dots"></div></div>
      <div class="cell"><div class="d">28</div><div class="dots"></div></div>
      <div class="cell"><div class="d">29</div><div class="dots"></div></div>

      <div class="cell"><div class="d" style="color: #DC3545">30</div><div class="dots"></div></div>
      <div class="cell"><div class="d">31</div><div class="dots"></div></div>
      <div class="cell"><div class="d" style="color: #DEE2E6">1</div><div class="dots"></div></div>
      <div class="cell"><div class="d" style="color: #DEE2E6">2</div><div class="dots"></div></div>
      <div class="cell"><div class="d" style="color: #DEE2E6">3</div><div class="dots"></div></div>
      <div class="cell"><div class="d" style="color: #DEE2E6">4</div><div class="dots"></div></div>
      <div class="cell"><div class="d" style="color: #DEE2E6">5</div><div class="dots"></div></div>

    </div>

    <!-- 범례 — 색만 있고 뜻이 없으면 점은 장식이다 -->
    <div style="display: flex; align-items: center; gap: 14px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #E9ECEF">
      <div style="display: flex; align-items: center; gap: 5px"><div class="dot" style="background: #FFA000"></div><div style="font-size: 11px; color: #6C757D">대기</div></div>
      <div style="display: flex; align-items: center; gap: 5px"><div class="dot" style="background: #28A745"></div><div style="font-size: 11px; color: #6C757D">승인</div></div>
      <div style="display: flex; align-items: center; gap: 5px"><div class="dot" style="background: #2B4593"></div><div style="font-size: 11px; color: #6C757D">완료</div></div>
      <div style="display: flex; align-items: center; gap: 5px"><div class="dot" style="background: #DC3545"></div><div style="font-size: 11px; color: #6C757D">거절</div></div>
    </div>
  </div>

  <!-- 선택한 날 -->
  <div style="flex: 1; padding: 18px 22px 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <div class="num" style="font-size: 15px; font-weight: 700; color: #212529">8월 24일 월요일</div>
      <div class="num" style="font-size: 12px; color: #ADB5BD">1건</div>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px; display: flex; overflow: hidden; box-shadow: 0 3px 18px rgba(26,43,92,0.08)">
      <div style="width: 4px; background: #C77700; flex-shrink: 0"></div>
      <div style="flex-grow: 1; min-width: 0; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
        <div class="num" style="font-size: 15px; font-weight: 700; color: #2B4593; flex-shrink: 0">18:00</div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <div style="display: flex; align-items: center; gap: 7px">
            <div style="font-size: 15px; font-weight: 700; color: #212529">동유진</div>
            <div style="font-size: 10px; font-weight: 600; color: #495057; background: #F1F3F5; border-radius: 5px; padding: 2px 6px">판매</div>
          </div>
          <div style="font-size: 12px; color: #6C757D">더 뉴 아이오닉5</div>
        </div>
        <div style="font-size: 11px; font-weight: 600; color: #C77700; flex-shrink: 0">대기중</div>
      </div>
    </div>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #E9ECEF; display: flex; padding: 10px 0 24px; margin-top: 14px">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ADB5BD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 13.5 6.2 8a2 2 0 0 1 1.9-1.4h7.8A2 2 0 0 1 17.8 8l1.7 5.5"/><path d="M4.5 13.5h15v4h-15z"/><circle cx="8" cy="17.5" r="1.2"/><circle cx="16" cy="17.5" r="1.2"/></svg>
      <div style="font-size: 10px; font-weight: 500; color: #ADB5BD">차량</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div style="position: relative; display: flex">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ADB5BD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.5a7 7 0 0 1-7 7H8l-4 2.5.9-3.6A7 7 0 0 1 13 5.5a7 7 0 0 1 7 7z"/></svg>
        <div style="position: absolute; top: -3px; right: -6px; min-width: 15px; height: 15px; border-radius: 8px; background: #2B4593; display: flex; align-items: center; justify-content: center; padding: 0 4px">
          <div class="num" style="font-size: 10px; font-weight: 700; color: #FFFFFF">1</div>
        </div>
      </div>
      <div style="font-size: 10px; font-weight: 500; color: #ADB5BD">상담</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B4593" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
      <div style="font-size: 10px; font-weight: 700; color: #212529">일정</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div style="position: relative; display: flex">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ADB5BD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17" cy="9.5" r="2.2"/><path d="M15 14.2c2.6-.5 5.5 1 5.5 4.8"/></svg>
        <div style="position: absolute; top: -3px; right: -6px; min-width: 15px; height: 15px; border-radius: 8px; background: #2B4593; display: flex; align-items: center; justify-content: center; padding: 0 4px">
          <div class="num" style="font-size: 10px; font-weight: 700; color: #FFFFFF">1</div>
        </div>
      </div>
      <div style="font-size: 10px; font-weight: 500; color: #ADB5BD">사용자</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ADB5BD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 5 6.5v5c0 4.3 2.9 7.6 7 9 4.1-1.4 7-4.7 7-9v-5z"/><path d="M9.5 12.2l1.8 1.8 3.4-3.6"/></svg>
      <div style="font-size: 10px; font-weight: 500; color: #ADB5BD">관리자</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
