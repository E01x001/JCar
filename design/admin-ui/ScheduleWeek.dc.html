<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    a { color: #2B4593; } a:hover { color: #1A2B5C; }
    * { box-sizing: border-box; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F8F9FA; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 20px 22px 0; display: flex; align-items: center; justify-content: space-between">
    <div style="font-size: 15px; font-weight: 600; color: #6C757D; letter-spacing: 0.02em">일정</div>
    <!-- 월 / 주 전환 — 월 뷰와 같은 자리, 같은 모양 -->
    <div style="display: flex; background: #F1F3F5; border-radius: 999px; padding: 3px">
      <div style="padding: 6px 15px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #6C757D">월</div>
      <div style="padding: 6px 15px; border-radius: 999px; background: #FFFFFF; font-size: 12px; font-weight: 700; color: #212529; box-shadow: 0 1px 3px rgba(26,43,92,0.10)">주</div>
    </div>
  </div>

  <!-- 주 단위 스트립 — 한 달 격자보다 "이번 주 언제 바쁜가"가 먼저다 -->
  <div style="padding: 16px 22px 0">
    <div class="num" style="font-size: 20px; font-weight: 700; color: #212529; letter-spacing: -0.01em; margin-bottom: 14px">8월 24일 <span style="font-size: 15px; font-weight: 500; color: #6C757D">월요일</span></div>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 0 9px; border-radius: 14px">
        <div style="font-size: 11px; font-weight: 500; color: #B02A37">일</div>
        <div class="num" style="font-size: 15px; font-weight: 600; color: #ADB5BD">23</div>
        <div style="width: 5px; height: 5px"></div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 0 9px; border-radius: 14px; background: #2B4593">
        <div style="font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.6)">월</div>
        <div class="num" style="font-size: 15px; font-weight: 700; color: #FFFFFF">24</div>
        <div style="width: 5px; height: 5px; border-radius: 3px; background: #FFA000"></div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 0 9px; border-radius: 14px">
        <div style="font-size: 11px; font-weight: 500; color: #ADB5BD">화</div>
        <div class="num" style="font-size: 15px; font-weight: 600; color: #212529">25</div>
        <div style="width: 5px; height: 5px"></div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 0 9px; border-radius: 14px">
        <div style="font-size: 11px; font-weight: 500; color: #ADB5BD">수</div>
        <div class="num" style="font-size: 15px; font-weight: 600; color: #212529">26</div>
        <div style="width: 5px; height: 5px; border-radius: 3px; background: #28A745"></div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 0 9px; border-radius: 14px">
        <div style="font-size: 11px; font-weight: 500; color: #ADB5BD">목</div>
        <div class="num" style="font-size: 15px; font-weight: 600; color: #212529">27</div>
        <div style="width: 5px; height: 5px"></div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 0 9px; border-radius: 14px">
        <div style="font-size: 11px; font-weight: 500; color: #ADB5BD">금</div>
        <div class="num" style="font-size: 15px; font-weight: 600; color: #212529">28</div>
        <div style="width: 5px; height: 5px"></div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 0 9px; border-radius: 14px">
        <div style="font-size: 11px; font-weight: 500; color: #2B4593">토</div>
        <div class="num" style="font-size: 15px; font-weight: 600; color: #212529">29</div>
        <div style="width: 5px; height: 5px"></div>
      </div>

    </div>
  </div>

  <!-- 타임라인 — 시간 축이 실제로 보인다. 지금은 날짜 밑 목록일 뿐이다 -->
  <div style="flex: 1; padding: 22px 22px 0; display: flex; flex-direction: column; gap: 0; overflow: hidden">

    <div style="display: flex; gap: 14px">
      <div class="num" style="width: 42px; flex-shrink: 0; font-size: 12px; font-weight: 600; color: #ADB5BD; padding-top: 1px">14:00</div>
      <div style="flex-grow: 1; border-top: 1px solid #E9ECEF; height: 42px"></div>
    </div>

    <div style="display: flex; gap: 14px">
      <div class="num" style="width: 42px; flex-shrink: 0; font-size: 12px; font-weight: 600; color: #ADB5BD; padding-top: 1px">16:00</div>
      <div style="flex-grow: 1; border-top: 1px solid #E9ECEF; height: 42px"></div>
    </div>

    <div style="display: flex; gap: 14px">
      <div class="num" style="width: 42px; flex-shrink: 0; font-size: 12px; font-weight: 700; color: #212529; padding-top: 1px">18:00</div>
      <div style="flex-grow: 1; border-top: 1px solid #2B4593; padding-top: 10px">

        <div style="background: #FFFFFF; border-radius: 16px; display: flex; overflow: hidden; box-shadow: 0 3px 18px rgba(26,43,92,0.08)">
          <div style="width: 4px; background: #C77700; flex-shrink: 0"></div>
          <div style="flex-grow: 1; min-width: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 9px">
            <div style="display: flex; align-items: center; gap: 8px">
              <div style="font-size: 16px; font-weight: 700; color: #212529">동유진</div>
              <div style="font-size: 11px; font-weight: 600; color: #6C757D; background: #F1F3F5; border-radius: 5px; padding: 2px 6px">판매</div>
              <div style="flex-grow: 1"></div>
              <div style="font-size: 11px; font-weight: 600; color: #C77700">대기중</div>
            </div>
            <div style="font-size: 13px; color: #6C757D">더 뉴 아이오닉5</div>
            <div style="display: flex; align-items: center; gap: 7px; padding-top: 4px">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6C757D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4.5h3l1.4 3.4-1.9 1.3a11 11 0 0 0 5 5l1.3-1.9 3.4 1.4v3a1.5 1.5 0 0 1-1.6 1.5A14.5 14.5 0 0 1 5 6.1 1.5 1.5 0 0 1 6.5 4.5z"/></svg>
              <div class="num" style="font-size: 13px; font-weight: 600; color: #212529">010-5555-5555</div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div style="display: flex; gap: 14px; margin-top: 10px">
      <div class="num" style="width: 42px; flex-shrink: 0; font-size: 12px; font-weight: 600; color: #ADB5BD; padding-top: 1px">20:00</div>
      <div style="flex-grow: 1; border-top: 1px solid #E9ECEF; height: 30px"></div>
    </div>

  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #E9ECEF; display: flex; padding: 10px 0 24px; margin-top: 8px">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ADB5BD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 13.5 6.2 8a2 2 0 0 1 1.9-1.4h7.8A2 2 0 0 1 17.8 8l1.7 5.5"/><path d="M4.5 13.5h15v4h-15z"/><circle cx="8" cy="17.5" r="1.2"/><circle cx="16" cy="17.5" r="1.2"/></svg>
      <div style="font-size: 10px; font-weight: 500; color: #ADB5BD">차량</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div style="position: relative; display: flex">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ADB5BD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.5a7 7 0 0 1-7 7H8l-4 2.5.9-3.6A7 7 0 0 1 13 5.5a7 7 0 0 1 7 7z"/></svg>
        <div style="position: absolute; top: -3px; right: -6px; min-width: 15px; height: 15px; border-radius: 8px; background: #2B4593; display: flex; align-items: center; justify-content: center; padding: 0 4px">
          <div class="num" style="font-size: 10px; font-weight: 700; color: #FFFFFF">1</div>
        </div>
      </div>
      <div style="font-size: 10px; font-weight: 500; color: #ADB5BD">상담</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B4593" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
      <div style="font-size: 10px; font-weight: 700; color: #212529">일정</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div style="position: relative; display: flex">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ADB5BD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17" cy="9.5" r="2.2"/><path d="M15 14.2c2.6-.5 5.5 1 5.5 4.8"/></svg>
        <div style="position: absolute; top: -3px; right: -6px; min-width: 15px; height: 15px; border-radius: 8px; background: #2B4593; display: flex; align-items: center; justify-content: center; padding: 0 4px">
          <div class="num" style="font-size: 10px; font-weight: 700; color: #FFFFFF">1</div>
        </div>
      </div>
      <div style="font-size: 10px; font-weight: 500; color: #ADB5BD">사용자</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ADB5BD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 5 6.5v5c0 4.3 2.9 7.6 7 9 4.1-1.4 7-4.7 7-9v-5z"/><path d="M9.5 12.2l1.8 1.8 3.4-3.6"/></svg>
      <div style="font-size: 10px; font-weight: 500; color: #ADB5BD">관리자</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
