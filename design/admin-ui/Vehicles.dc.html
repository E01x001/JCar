<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    a { color: #2B4593; } a:hover { color: #1A2B5C; }
    * { box-sizing: border-box; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F8F9FA; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 20px 22px 0; display: flex; align-items: center; justify-content: space-between">
    <div style="font-size: 15px; font-weight: 600; color: #6C757D; letter-spacing: 0.02em">차량</div>
    <div style="display: flex; gap: 6px">
      <div style="width: 34px; height: 34px; border-radius: 17px; background: #FFFFFF; border: 1px solid #E9ECEF; display: flex; align-items: center; justify-content: center">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6C757D" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 3.5 3.5"/></svg>
      </div>
      <div style="width: 34px; height: 34px; border-radius: 17px; background: #FFFFFF; border: 1px solid #E9ECEF; display: flex; align-items: center; justify-content: center">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6C757D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M7 12h10M10 17.5h4"/></svg>
      </div>
    </div>
  </div>

  <!-- 히어로 — 매물 현황을 문장으로. 숫자 격자보다 읽힌다 -->
  <div style="padding: 12px 22px 20px">
    <div style="display: flex; align-items: flex-end; gap: 10px">
      <div class="num" style="font-size: 64px; font-weight: 700; color: #212529; line-height: 0.86">2</div>
      <div style="padding-bottom: 6px; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 16px; font-weight: 700; color: #212529">대가 노출 중입니다</div>
        <div style="font-size: 13px; color: #6C757D">1대는 아직 매입가가 없습니다</div>
      </div>
    </div>
  </div>

  <div style="padding: 0 22px 14px; display: flex; gap: 7px">
    <div style="background: #2B4593; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: #FFFFFF">전체</div>
    <div style="border: 1px solid #E1E5EA; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: #6C757D">매입예정</div>
    <div style="border: 1px solid #E1E5EA; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: #6C757D">매입진행</div>
    <div style="border: 1px solid #E1E5EA; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: #6C757D">재고</div>
  </div>

  <div style="flex: 1; padding: 0 22px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

    <!-- 차량 카드 — 이미지가 카드의 주인공. 지금은 56px 썸네일로 눌려 있다 -->
    <div style="background: #FFFFFF; border-radius: 18px; overflow: hidden; box-shadow: 0 3px 18px rgba(26,43,92,0.08)">
      <div style="height: 128px; background: linear-gradient(145deg, #EEF1F5 0%, #DEE2E6 100%); display: flex; align-items: center; justify-content: center; position: relative">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#ADB5BD" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 13.5 6.2 8a2 2 0 0 1 1.9-1.4h7.8A2 2 0 0 1 17.8 8l1.7 5.5"/><path d="M4.5 13.5h15v4h-15z"/><circle cx="8" cy="17.5" r="1.2"/><circle cx="16" cy="17.5" r="1.2"/></svg>
        <div style="position: absolute; top: 12px; left: 12px; background: rgba(33,37,41,0.82); border-radius: 999px; padding: 5px 11px; font-size: 11px; font-weight: 600; color: #FFFFFF">매입예정</div>
      </div>
      <div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: flex-start; gap: 12px">
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <div style="font-size: 17px; font-weight: 700; color: #212529; letter-spacing: -0.01em">더 뉴 아이오닉5</div>
            <div class="num" style="font-size: 13px; color: #6C757D">현대 · 2024 · 12,400km</div>
          </div>
          <div style="text-align: right; flex-shrink: 0">
            <div style="font-size: 11px; color: #ADB5BD; margin-bottom: 2px">매입가</div>
            <div class="num" style="font-size: 16px; font-weight: 700; color: #212529">3,180만</div>
          </div>
        </div>
        <div style="display: flex; gap: 8px">
          <div style="flex-grow: 1; height: 44px; border-radius: 14px; border: 1px solid #E1E5EA; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #212529">가격 수정</div>
          <div style="width: 44px; height: 44px; border-radius: 14px; background: #FCE9EB; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#DC3545" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7"/><path d="M6.5 7.5 7.4 19a1.5 1.5 0 0 0 1.5 1.4h6.2a1.5 1.5 0 0 0 1.5-1.4L17.5 7.5"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- 매입가 미설정 — 값 없음을 명시하고 그것 자체를 할 일로 만든다 -->
    <div style="background: #FFFFFF; border-radius: 18px; overflow: hidden; box-shadow: 0 3px 18px rgba(26,43,92,0.08)">
      <div style="padding: 16px 18px; display: flex; align-items: center; gap: 14px">
        <div style="width: 64px; height: 64px; border-radius: 14px; background: #EEF1F5; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ADB5BD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 13.5 6.2 8a2 2 0 0 1 1.9-1.4h7.8A2 2 0 0 1 17.8 8l1.7 5.5"/><path d="M4.5 13.5h15v4h-15z"/><circle cx="8" cy="17.5" r="1.2"/><circle cx="16" cy="17.5" r="1.2"/></svg>
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 17px; font-weight: 700; color: #212529; letter-spacing: -0.01em">팰리세이드</div>
          <div class="num" style="font-size: 13px; color: #6C757D">현대 · 2022 · 48,900km</div>
          <div style="display: flex; align-items: center; gap: 5px; margin-top: 2px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#C77700" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 15.8v.2"/></svg>
            <div style="font-size: 12px; font-weight: 600; color: #C77700">매입가 미설정</div>
          </div>
        </div>
      </div>
      <div style="padding: 0 18px 16px">
        <div style="height: 44px; border-radius: 14px; background: #2B4593; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #FFFFFF">매입가 입력</div>
      </div>
    </div>

  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #E9ECEF; display: flex; padding: 10px 0 24px; margin-top: 14px">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B4593" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 13.5 6.2 8a2 2 0 0 1 1.9-1.4h7.8A2 2 0 0 1 17.8 8l1.7 5.5"/><path d="M4.5 13.5h15v4h-15z"/><circle cx="8" cy="17.5" r="1.2"/><circle cx="16" cy="17.5" r="1.2"/></svg>
      <div style="font-size: 10px; font-weight: 700; color: #212529">차량</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div style="position: relative; display: flex">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ADB5BD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.5a7 7 0 0 1-7 7H8l-4 2.5.9-3.6A7 7 0 0 1 13 5.5a7 7 0 0 1 7 7z"/></svg>
        <div style="position: absolute; top: -3px; right: -6px; min-width: 15px; height: 15px; border-radius: 8px; background: #2B4593; display: flex; align-items: center; justify-content: center; padding: 0 4px">
          <div class="num" style="font-size: 10px; font-weight: 700; color: #FFFFFF">1</div>
        </div>
      </div>
      <div style="font-size: 10px; font-weight: 500; color: #ADB5BD">상담</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ADB5BD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
      <div style="font-size: 10px; font-weight: 500; color: #ADB5BD">일정</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ADB5BD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17" cy="9.5" r="2.2"/><path d="M15 14.2c2.6-.5 5.5 1 5.5 4.8"/></svg>
      <div style="font-size: 10px; font-weight: 500; color: #ADB5BD">사용자</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ADB5BD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 5 6.5v5c0 4.3 2.9 7.6 7 9 4.1-1.4 7-4.7 7-9v-5z"/><path d="M9.5 12.2l1.8 1.8 3.4-3.6"/></svg>
      <div style="font-size: 10px; font-weight: 500; color: #ADB5BD">관리자</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
