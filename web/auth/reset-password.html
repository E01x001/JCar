<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>비밀번호 재설정 — J-Car</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <div class="card">
      <div class="logo">J-Car</div>
      <h1 id="title">비밀번호 재설정</h1>
      <p class="lead" id="desc">새 비밀번호를 입력해주세요.</p>

      <form id="form">
        <label for="pw">새 비밀번호</label>
        <input id="pw" type="password" autocomplete="new-password"
               placeholder="8자 이상, 소문자와 숫자 포함" />
        <label for="pw2">새 비밀번호 확인</label>
        <input id="pw2" type="password" autocomplete="new-password"
               placeholder="한 번 더 입력" />
        <button id="submit" type="submit">비밀번호 변경</button>
      </form>

      <p class="msg" id="msg"></p>
    </div>
    <footer class="foot">© J-Car</footer>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // 공개 키만 사용한다(앱과 동일). 비밀 키는 절대 웹에 두지 않는다.
    const supabase = createClient(
      'https://thorgkxpbhsttgskhepu.supabase.co',
      'sb_publishable_tcC3WnbxkcI8bveaPvhYQg_U8UZmDzt',
      { auth: { detectSessionInUrl: false, persistSession: false } }
    );

    const $ = (id) => document.getElementById(id);
    const msg = $('msg');
    const form = $('form');

    const fail = (text) => {
      $('title').textContent = '링크가 유효하지 않습니다';
      $('desc').textContent = text;
      form.style.display = 'none';
    };

    // 복구 세션 확보.
    // Supabase는 클라이언트 설정에 따라 두 형태로 돌려보낸다:
    //   implicit → #access_token=...&refresh_token=...
    //   pkce     → ?code=...
    // 어느 쪽이든 받도록 둘 다 처리한다.
    const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
    const query = new URLSearchParams(location.search);

    const errText = hash.get('error_description') || query.get('error_description');
    if (errText) {
      fail('링크가 만료되었거나 이미 사용되었습니다. 앱에서 다시 요청해주세요.');
    } else {
      const accessToken = hash.get('access_token');
      const refreshToken = hash.get('refresh_token');
      const code = query.get('code');

      if (accessToken && refreshToken) {
        const { error } = await supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken,
        });
        if (error) { fail('세션을 확인하지 못했습니다. 앱에서 다시 요청해주세요.'); }
      } else if (code) {
        const { error } = await supabase.auth.exchangeCodeForSession(code);
        if (error) { fail('세션을 확인하지 못했습니다. 앱에서 다시 요청해주세요.'); }
      } else {
        fail('비밀번호 재설정 메일의 링크로 접속해주세요.');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = $('pw').value;
      const pw2 = $('pw2').value;
      msg.className = 'msg';

      // 앱의 회원가입 규칙과 동일하게 맞춘다(RegisterScreen.isValidPassword)
      if (!/^(?=.*[a-z])(?=.*\d).{8,}$/.test(pw)) {
        msg.className = 'msg err';
        msg.textContent = '8자 이상이며 소문자와 숫자를 포함해야 합니다.';
        return;
      }
      if (pw !== pw2) {
        msg.className = 'msg err';
        msg.textContent = '두 비밀번호가 일치하지 않습니다.';
        return;
      }

      $('submit').disabled = true;
      $('submit').textContent = '변경 중...';

      const { error } = await supabase.auth.updateUser({ password: pw });

      if (error) {
        msg.className = 'msg err';
        msg.textContent = '변경에 실패했습니다. 링크가 만료되었을 수 있습니다.';
        $('submit').disabled = false;
        $('submit').textContent = '비밀번호 변경';
        return;
      }

      // 재설정 세션은 여기서 끝낸다 — 웹에 세션을 남기지 않는다
      await supabase.auth.signOut();
      $('title').textContent = '비밀번호가 변경되었습니다';
      $('desc').textContent = '앱으로 돌아가 새 비밀번호로 로그인해주세요.';
      form.style.display = 'none';
      msg.textContent = '';
    });
  </script>
</body>
</html>
